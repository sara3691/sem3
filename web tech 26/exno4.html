<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Blog</title>

    <link rel="stylesheet" href="style_ex4.css">

    <!-- Font Awesome (Clock Icon) -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        body{
            width: 70%;

        }
        .card-1:hover,
        .card-2:hover,
        .card-3:hover {
            background-color: rgb(181, 206, 206);
            border-radius: 20px;
            border-color:rgb(62, 85, 85) ;
            width:300px;
         
        }

        .card-1 img,
        .card-2 img,
        .card-3 img {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            border-color: #4b00fa;
            border-style: double;
            background-color: lavender;
        }

        /* Fixed */
        .card-1 img:hover,
        .card-2 img:hover,
        .card-3 img:hover {
            transform: scale(1.05);
           
        }

        .content h3 {
            margin-left: 10px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="header poppins-bold">

            <h1 style="text-transform: uppercase;text-align: center;" >
                My <span style="color: blue;">BLOG</span>
            </h1>

            <div class="head-content"></div>

            <span class="line"></span>

        </div>

        <div class="projects">

            <div class="card-1" style="align-content: center;">

                <img src="https://picsum.photos/300/200?3" alt="Project 1">

                <div class="content">

                    <span class="date poppins-semibold">
                        <i class="fa fa-clock-o"> inline css </i> july 23,2026
                    </span>

                    <span class="design poppins-semibold"> | Design</span>

                    <h3 class="poppins-bold">Make your Website</h3>

                    <a href="#" class="poppins-bold">Read More</a>

                </div>

            </div>

            <div class="card-2">

                <img src="https://picsum.photos/300/200?4" alt="Project 2">

                <div class="content">

                    <span class="date poppins-semibold">
                        <i class="fa fa-clock-o"></i> May 31,2023
                    </span>

                    <span class="design poppins-semibold"> | Design</span>

                    <h3 class="poppins-bold">Make your Website</h3>

                    <a href="#" class="poppins-bold">Read More</a>

                </div>

            </div>

            <div class="card-3">

                <img src="https://picsum.photos/300/200?0" alt="Project 3">

                <div class="content">

                    <span class="date poppins-semibold">
                        <i class="fa fa-clock-o"></i> May 31,2024
                    </span>

                    <span class="design poppins-semibold"> | Design</span>

                    <h3 class="poppins-bold">Make your Website</h3>

                    <a href="#" class="poppins-bold" style="text-align:center;">Read More</a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
