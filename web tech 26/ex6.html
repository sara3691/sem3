<!DOCTYPE html>
<html>
<head>
    <title>Image Map Example</title>
    <link rel="stylesheet" href="style6.css">
</head>

<body>

<center>

<h2>Frontend Technologies</h2>

<img src="react.png"
     width="150"
     height="150"
     usemap="#reactmap">

<map name="reactmap">
    <area shape="rect"
          coords="0,0,150,150"
          href="https://react.dev"
          target="_blank"
          alt="React">
</map>


<img src="html.png"
     width="150"
     height="150"
     usemap="#htmlmap">

<map name="htmlmap">
    <area shape="rect"
          coords="0,0,150,150"
          href="https://developer.mozilla.org/en-US/docs/Web/HTML"
          target="_blank"
          alt="HTML">
</map>


<img src="css.png"
     width="150"
     height="150"
     usemap="#cssmap">

<map name="cssmap">
    <area shape="rect"
          coords="0,0,150,150"
          href="https://developer.mozilla.org/en-US/docs/Web/CSS"
          target="_blank"
          alt="CSS">
</map>


<h2>Backend Technologies</h2>

<img src="nodejs.png"
     width="150"
     height="150"
     usemap="#nodejsmap">

<map name="nodejsmap">
    <area shape="rect"
          coords="0,0,150,150"
          href="https://nodejs.org"
          target="_blank"
          alt="Node.js">
</map>


<img src="javascript.png"
     width="150"
     height="150"
     usemap="#jsmap">

<map name="jsmap">
    <area shape="rect"
          coords="0,0,150,150"
          href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"
          target="_blank"
          alt="JavaScript">
</map>


<img src="python.png"
     width="150"
     height="150"
     usemap="#pythonmap">

<map name="pythonmap">
    <area shape="rect"
          coords="0,0,150,150"
          href="https://www.python.org"
          target="_blank"
          alt="Python">
</map>

</center>

</body>
</html>
