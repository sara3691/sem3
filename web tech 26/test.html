<html>
    <head>
        <title>My Page</title>
        <style>
            img{
                border-radius: 2px;
                border-style: solid;
                border-color: aqua;
                margin: 10px;
            }
        </style>
    </head>
    <body>
        <center>
            <h1>frontend technologies</h1>
            <img src="htmlimage.jpg" alt="html" usemap="#htmlmap" height="150" width="150">
            <map name="htmlmap">
                <area shape="rect" coords="0,0,150,150" href="" alt="">
            </map>
            <img src="css.jpg" alt="css" height="150" with="150" usemap="#cssmap">
            <map name="cssmap">
                <area shape="rect" coords="0,0,150,150" href="" alt="">
            </map>
            <h1>backend technologies </h1>
            <img src="nodejs.jpg" alt="nodejs" height="150" width="150" usemap="#nodejsmap">
            <map name="nodejsmap">
                <area shape="rect" coords="0,0,150,150," href="" alt="">
            </map>
        </center>
    </body>
</html>
