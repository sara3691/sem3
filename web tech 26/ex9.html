<!DOCTYPE html>
<html>
<head>
<title>Hide and Show Paragraph</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
$("#hideBtn").click(function() {
$("p").toggle();
});
});
</script>
</head>
<body>
<h2>Hide Paragraph using jQuery</h2>
<p>Periyar University, established in 1997 at Salem, Tamil Nadu, promotes knowledge and social justice.</p>
<button id="hideBtn">Hide Paragraph</button>
</body>
</html>
