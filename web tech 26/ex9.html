
<!DOCTYPE html>
<html>
<head>
    <title>Hide Paragraph using jQuery</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>

    <script>
        $(document).ready(function() {
            $("button").click(function() {
                $("p").toggle();
            });
        });
    </script>
</head>

<body>

    <h2>Hide and Show Paragraph</h2>

    <p>This is a simple paragraph using jQuery.</p>

    <button>Hide / Show Paragraph</button>

</body>
</html>
