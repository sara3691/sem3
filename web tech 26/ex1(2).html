
<!DOCTYPE html>
<html>
<head>
    <title>Education Details</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
            color: darkblue;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h2>My Education Details</h2>

    <table>
        <tr>
            <th>Qualification</th>
            <th>Institution</th>
            <th>Year</th>
            <th>Percentage</th>
        </tr>

        <tr>
            <td>10th</td>
            <td>ABC School</td>
            <td>2020</td>
            <td>85%</td>
        </tr>

        <tr>
            <td>12th</td>
            <td>ABC School</td>
            <td>2022</td>
            <td>88%</td>
        </tr>

        <tr>
            <td>B.Sc Computer Science</td>
            <td>XYZ College</td>
            <td>2025</td>
            <td>90%</td>
        </tr>
    </table>

</body>
</html>
